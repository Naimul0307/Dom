<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate Elements with JS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Welcome JS</h1> 
    
    <!-- Section 1 -->
    <div class="section">
        <button id="generateTag">Generate Tag</button>
        <div id="tagOutput"></div>
    </div>

    <!-- Section 2 -->
    <div class="section">
        <input type="number" id="inputNumber" placeholder="Enter Your Number">
        <button id="generateTable">Generate Table</button>
        <div id="tableOutput"></div>
    </div>

    <div class="section">
    <h3>User Form</h3>

    <input type="text" id="name" placeholder="Enter Name"><br><br>
    <input type="email" id="email" placeholder="Enter Email"><br><br>
    <input type="text" id="phone" placeholder="Enter Phone"><br><br>

    <button id="addUser">Add User</button>

    <table id="userTable">
        <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
    </div>
    <div class="section">
        <input type="text" id="itemName" placeholder="Enter Itame Name"><br><br>
        <button id="addItem">Add items</button>
        <ul id="itemList"></ul>
    </div>
    <script src="index.js"></script>
</body>
</html>
