<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>3D Expense Tracker</title>
  <link rel="stylesheet" href="index.css">
</head>

<body>
  <div class="card">
    <h2>Expense Tracker</h2>

    <div class="balance-box">
      <p>Your Balance</p>
      <h1 id="balance">Ɖ 0.00</h1>
    </div>

    <div class="summary">
      <div class="income">
        <p>Income</p>
        <h3 id="money-plus">Ɖ 0.00</h3>
      </div>

      <div class="expense">
        <p>Expense</p>
        <h3 id="money-minus">Ɖ 0.00</h3>
      </div>
    </div>

    <form class="form" id="form">
      <h3>Add Transaction</h3>

      <div class="form-control">
        <label>Type</label>

        <input type="hidden" id="type" value="income">

        <div class="dropdown">
          <div class="dropdown-selected">Select Type</div>

          <div class="dropdown-options">
            <div class="option" data-value="income">Income</div>
            <div class="option" data-value="expense">Expense</div>
          </div>
        </div>
      </div>

      <div class="form-control">
        <label for="text">Description</label>
        <input type="text" id="text" placeholder="Enter description..." />
      </div>

      <div class="form-control">
        <label for="amount">Amount</label>
        <input type="number" id="amount" placeholder="Enter amount..." />
      </div>

      <button class="btn">Add</button>
    </form>

    <div class="history">
      <h3>History</h3>
      <ul id="history-list"></ul>
    </div>
  </div>

  <script src="index.js"></script>
</body>
</html>
