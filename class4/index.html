<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Form App</title>
</head>
<body>

<section class="container">

    <!-- CARD 1 -->
    <div class="card card1">
        <form id="myForm">
            <h1>User Form</h1>

            <label>Name</label>
            <input type="text" id="name" placeholder="Enter Your Name">

            <label>Password</label>
            <input type="password" id="password" placeholder="Enter Your Password">

            <button type="button" id="toggleButton">Show Password</button>
            <button type="submit" id="submitButton">Submit</button>
            <br>
            <p id="userList"></p>
        </form>
    </div>

    <!-- CARD 2 -->
    <div class="card card2">
        <h1>Number Checker</h1>
        <p>Guess The Number Between 0 to 10</p>
        <br>
        <label>Enter Number</label>
        <input type="number" id="number" placeholder="Enter a number">

        <button id="checkButton">Check</button>
        <br>
        <p id="result"></p>
    </div>
    <!-- CARD 3 -->
    <div class="card card3">
        <h1>Temperature Converter</h1>

        <label>Enter Value</label>
        <input type="number" id="tempInput" placeholder="Enter temperature">

        <label>Convert</label>
        <select id="convertType">
            <option value="cToF">Celsius → Fahrenheit</option>
            <option value="fToC">Fahrenheit → Celsius</option>
        </select>

        <button id="convertButton">Convert</button>
        <br>
        <p id="tempResult"></p>
    </div>
</section>

<script src="index.js"></script>
</body>
</html>
